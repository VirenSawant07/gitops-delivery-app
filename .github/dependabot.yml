version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/services/api", "/services/inventory"]
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/services/api", "/services/inventory"]
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
