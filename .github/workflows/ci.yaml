name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/virensawant07
  # Pinned by digest: in March 2026 attackers re-pointed mutable Trivy tags to credential-stealing builds.
  TRIVY_IMAGE: aquasec/trivy:0.71.1@sha256:53570e6911c2361ebe7995228088cf83a6b9b73e7f3cdca44bd8f8f425e80fa7

jobs:
  build:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, inventory]
    env:
      IMAGE: ghcr.io/virensawant07/gitops-${{ matrix.service }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r services/${{ matrix.service }}/requirements.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        working-directory: services/${{ matrix.service }}
        run: python -m pytest -q

      - name: Build image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t "$IMAGE" services/${{ matrix.service }}

      - name: Scan image (fails on fixable CRITICAL vulnerabilities)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress "$IMAGE"

      - name: Push image
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"

  deploy-staging:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # One deploy at a time, so two merges can't overwrite each other's tag bump
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: VirenSawant07/gitops-delivery-config
          ssh-key: ${{ secrets.CONFIG_REPO_DEPLOY_KEY }}

      - name: Point staging at the new images
        run: |
          for svc in api inventory; do
            yq -i ".image.tag = \"$GITHUB_SHA\"" "apps/staging/$svc.yaml"
          done

      - name: Commit and push to the config repo
        run: |
          if git diff --quiet; then echo "staging already on $GITHUB_SHA"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(staging): api, inventory ${GITHUB_SHA::7}" \
            -m "Source: https://github.com/${{ github.repository }}/commit/$GITHUB_SHA"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
